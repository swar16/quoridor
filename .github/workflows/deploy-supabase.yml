name: Deploy Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment settings
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Set the SUPABASE_ACCESS_TOKEN repository secret.'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Set the SUPABASE_DB_PASSWORD repository secret.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Set the SUPABASE_PROJECT_REF repository variable.'; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
