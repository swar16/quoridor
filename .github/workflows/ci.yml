name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Provide placeholder local.properties
        run: |
          {
            echo "SUPABASE_URL=https://example.supabase.co"
            echo "SUPABASE_ANON_KEY=ci-placeholder"
          } > local.properties
      - name: Unit tests
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: app/build/reports/tests/

  deno:
    name: Deno tests (edge functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check supabase/functions/_shared/*_test.ts
      - run: deno check supabase/functions/*/index.ts
      - run: deno test supabase/functions

  db:
    name: Database tests (migrations, RLS, triggers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci
        working-directory: supabase/tests
      - run: npm test
        working-directory: supabase/tests

  web:
    name: Web app (types, tests, build, browser test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - name: Browser test (real Chrome, phone-sized)
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          npx --yes wait-on http://127.0.0.1:4173
          CHROME="$(which google-chrome)" node e2e/smoke.mjs http://127.0.0.1:4173 shots
      - name: Online latency and game-clock regression (mock transport, real browser)
        run: |
          npx vite --port 5173 --host 127.0.0.1 &
          npx --yes wait-on http://127.0.0.1:5173
          CHROME="$(which google-chrome)" node e2e/online-regression.mjs http://127.0.0.1:5173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: web/shots/

