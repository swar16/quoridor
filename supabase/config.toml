[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = false  # anonymous-only

[functions.create-room]
verify_jwt = true

[functions.join-room]
verify_jwt = true

[functions.get-room]
verify_jwt = true

[functions.submit-action]
verify_jwt = true

[functions.claim-timeout]
verify_jwt = true

# Called by a scheduler with a shared secret rather than a user JWT
[functions.cleanup-rooms]
verify_jwt = false
